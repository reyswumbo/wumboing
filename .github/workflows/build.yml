name: Build APK/AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create release keystore
        run: |
          mkdir -p $HOME/.wumboing
          keytool -genkeypair -v \
            -keystore $HOME/.wumboing/wumboing.jks \
            -alias wumboing \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wumboing -keypass wumboing \
            -dname "CN=Wumboing, OU=Dev, O=Wumboing, L=City, ST=State, C=ID"

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          WUMBOING_KEYSTORE: ${{ runner.home }}/.wumboing/wumboing.jks
          WUMBOING_STORE_PASS: wumboing
          WUMBOING_KEY_ALIAS: wumboing
          WUMBOING_KEY_PASS: wumboing

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wumboing-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wumboing-aab
          path: app/build/outputs/bundle/release/*.aab
